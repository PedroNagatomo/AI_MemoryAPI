name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:   # permite rodar manualmente pela UI

# Cancela runs antigos se novo push chegar na mesma branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ==================================================
  # 1. Backend (Maven + testes)
  # ==================================================
  backend:
    name: Backend (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile
        working-directory: backend
        run: mvn -B -ntp clean compile

      - name: Run tests
        working-directory: backend
        run: mvn -B -ntp test
        env:
          # Testcontainers usam o Docker do runner
          TESTCONTAINERS_RYUK_DISABLED: true

      - name: Package (skip tests — já rodaram)
        working-directory: backend
        run: mvn -B -ntp package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # ==================================================
  # 2. SDK TypeScript
  # ==================================================
  sdk:
    name: SDK (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: sdk/typescript

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          echo "✅ SDK build OK"

  # ==================================================
  # 3. Docker build (só se backend + sdk passarem)
  # ==================================================
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, sdk]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: ai-memory-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate docker-compose
        run: |
          cp .env.example .env
          docker compose config > /dev/null
          echo "✅ docker-compose.yml válido"