services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aimemory-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aimemory}
      POSTGRES_USER: ${POSTGRES_USER:-aimemory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aimemory_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aimemory}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aimemory-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aimemory}
      DATABASE_USER: ${POSTGRES_USER:-aimemory}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-aimemory_dev}
      GROQ_API_KEY: ${GROQ_API_KEY}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-min-32-chars}
      PORT: 8081
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8081/health",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: aimemory-adminer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8082}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    restart: unless-stopped

volumes:
  postgres_data:
